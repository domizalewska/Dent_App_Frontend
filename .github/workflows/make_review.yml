name: AI Code Review

on:
  pull_request:
    branches: [ dev ]
    types: [ opened ]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files diff
        run: |
          git diff origin/dev...HEAD -- '*.vue' '*.ts' '*.js' > diff.txt
          echo "Diff size: $(wc -c < diff.txt) bytes"

      - name: Run AI Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, urllib.error

          with open('diff.txt') as f:
              diff = f.read().strip()

          if not diff:
              print("No changes in .vue/.ts/.js files, skipping.")
              exit(0)

          api_key = os.environ['ANTHROPIC_API_KEY']
          gh_token = os.environ['GH_TOKEN']
          pr_number = os.environ['PR_NUMBER']
          repo = os.environ['REPO']

          payload = json.dumps({
              "model": "claude-sonnet-4-20250514",
              "max_tokens": 1024,
              "messages": [{
                  "role": "user",
                  "content": "Jestes senior developerem reviewujacym kod. Przeanalizuj ponizszy git diff i napisz krotki code review po polsku. Zwroc uwage na: potencjalne bledy, jakosc kodu, dobre praktyki Vue/TypeScript. Badz konkretny i konstruktywny. Jezeli kod jest dobry - napisz to. Odpowiedz w formacie Markdown.\n\nDiff:\n```\n" + diff + "\n```"
              }]
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload,
              headers={
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read())
                  comment = data["content"][0]["text"]
                  print("Claude responded successfully!")
          except urllib.error.HTTPError as e:
              error_body = e.read().decode()
              print(f"API Error {e.code}: {error_body}")
              exit(1)

          body = "## Robot AI Code Review\n\n" + comment + "\n\n---\n*Wygenerowane przez Claude AI*"
          pr_payload = json.dumps({"body": body}).encode()

          pr_req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments",
              data=pr_payload,
              headers={
                  "Authorization": f"Bearer {gh_token}",
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(pr_req) as resp:
              print(f"Comment posted! Status: {resp.status}")
          EOF